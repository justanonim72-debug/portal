<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#05070a" />
  <meta name="color-scheme" content="dark" />
  <title>Portal</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app" data-state="boot" data-facing="user">
    <video id="camera" playsinline muted></video>
    <canvas id="stage" aria-label="Kamera dengan portal real-time"></canvas>

    <section id="intro" class="intro">
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <h1>PORTAL</h1>
      <p>V5: tracking jalan di worker terpisah. Satu tangan dikontrol jempol + telunjuk, sementara jari lain cuma melengkungkan membran portal.</p>
      <button id="startBtn" class="primary" type="button">Mulai kamera</button>
      <small id="bootStatus">Menyiapkan tracking worker…</small>
    </section>

    <header class="hud top-hud" aria-live="polite">
      <div class="status-pill"><i id="statusDot"></i><span id="statusText">Memuat model</span></div>
      <div class="fps-pill"><span id="fps">--</span> FPS</div>
    </header>

    <div id="recBadge" class="rec-badge"><span></span> REC <b id="recTime">00:00</b></div>
    <aside id="hint" class="hint">Tunjukkan <b>satu atau dua tangan</b></aside>

    <nav class="controls" aria-label="Kontrol portal">
      <button id="filterBtn" class="control wide" type="button">
        <span class="control-label">EFFECT COMBO</span>
        <strong id="filterName">THERMAL HOLO</strong>
      </button>
      <button id="recBtn" class="control icon-btn rec-btn" type="button" aria-label="Mulai atau hentikan rekaman">●</button>
      <button id="debugBtn" class="control icon-btn" type="button" aria-label="Tampilkan titik tangan">⌁</button>
      <button id="cameraBtn" class="control icon-btn" type="button" aria-label="Ganti kamera">↺</button>
    </nav>

    <div id="toast" class="toast" role="status"></div>
  </main>

  <script type="module" src="./portal-v5.js"></script>
</body>
</html>
